<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<style>
  :root { color-scheme: light; --paper: #F5F0E8; --ink: #1A1A1A; --mute: #5a554d; --rule: #d9d1c3; }
  html { background: var(--paper); }
  body { margin: 0 auto; max-width: 42rem; padding: 3rem 1.25rem 5rem; color: var(--ink); background: var(--paper);
    font: 17px/1.75 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo",
      "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif TC", serif; -webkit-text-size-adjust: 100%; }
  :lang(ko) { word-break: keep-all; }
  :lang(ja) { line-break: strict; }
  h1 { font-size: 1.9rem; line-height: 1.3; font-weight: 400; margin: 2.5rem 0 1rem; }
  h2 { font-size: 1.15rem; font-weight: 600; margin: 2.25rem 0 .5rem; }
  a { color: var(--ink); text-underline-offset: .18em; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 3rem 0; }
  .langs { font-size: .9rem; color: var(--mute); line-height: 2; }
  .langs strong { color: var(--ink); font-weight: 600; }
  .note { border-left: 2px solid var(--ink); padding-left: 1rem; }
  table { display: block; overflow-x: auto; border-collapse: collapse; font-size: .88rem; line-height: 1.55; margin: 1rem 0; }
  th, td { border-top: 1px solid var(--rule); padding: .55rem .7rem .55rem 0; text-align: left; vertical-align: top; min-width: 7rem; }
  th { font-weight: 600; }
  ul { padding-left: 1.2rem; }
  li { margin: .35rem 0; }
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
